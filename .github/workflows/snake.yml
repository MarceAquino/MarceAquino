name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # Se ejecuta cada 12 horas
  workflow_dispatch:        # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      # Genera la animación Snake
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: MarceAquino  # ¡Reemplaza esto con tu nombre de usuario!
          svg_out_path: dist/github-contribution-grid-snake-dark.svg
          snake_color: '00FF00'  # Color verde para efecto Matrix
      
      # Publica la animación en una rama llamada "output"
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
